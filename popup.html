<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screenshot Capture</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --panel: #121820;
      --primary: #3869D9;
      --primary-hover: #4274EA;
      --shelf: #202A3A;
      --shelf-hover: #263247;
      --divider: #344154;
      --shelf-divider: #435168;
      --text: #FFFFFF;
      --muted: #C4CEDD;
      --focus: #8EA8F5;
    }
    html,
    body {
      margin: 0;
      background: var(--panel);
    }
    body {
      position: relative;
      width: 300px;
      height: 244px;
      padding: 16px;
      border-radius: 8px;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    button {
      margin: 0;
      border: 0;
      color: inherit;
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-align: center;
      transition:
        background-color 140ms ease,
        color 140ms ease,
        opacity 140ms ease;
    }
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    button:disabled {
      cursor: default;
      opacity: 0.65;
    }
    .panel {
      width: 268px;
    }
    .primary-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 268px;
      height: 80px;
      border-radius: 8px;
      background: var(--primary);
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }
    .primary-action:hover {
      background: var(--primary-hover);
    }
    .primary-action .icon {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
    }
    .primary-action span:last-child {
      min-width: 0;
      flex: 0 1 auto;
    }
    .capture-shelf {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 268px;
      height: 66px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 8px;
      background: var(--shelf);
    }
    .capture-shelf::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--shelf-divider);
      transform: translateX(-0.5px);
    }
    .shelf-action {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      width: 134px;
      height: 66px;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
    }
    .shelf-action:hover {
      background: var(--shelf-hover);
    }
    .shelf-action .icon {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }
    .section-divider {
      width: 268px;
      height: 1px;
      margin-top: 14px;
      background: var(--divider);
    }
    .history-row {
      display: flex;
      align-items: center;
      width: 268px;
      height: 37px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      text-align: left;
    }
    .history-row:hover {
      color: var(--text);
    }
    .history-row .history-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      flex: 0 0 auto;
    }
    .history-row .chevron {
      width: 16px;
      height: 16px;
      margin-left: auto;
      flex: 0 0 auto;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }
    #status {
      position: absolute;
      right: 16px;
      bottom: 4px;
      left: 16px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      text-align: center;
    }
    #status:empty { display: none; }
    #status.loading::after {
      content: "...";
      display: inline-block;
      overflow: hidden;
      width: 0;
      text-align: left;
      animation: dots 1100ms steps(4, end) infinite;
      vertical-align: bottom;
    }
    @keyframes dots {
      to { width: 1.2em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="Screenshot actions">
    <button class="primary-action" data-mode="fullPage" title="Capture and stitch the full page (Alt-click to choose which area scrolls)">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4.5h9.5L24 10v17.5H9V4.5Z"></path>
          <path d="M18.5 4.5V10H24"></path>
          <path d="M13 15.5h3"></path>
          <path d="M19 15.5h1.5v3"></path>
          <path d="M20.5 22v1.5H17"></path>
          <path d="M13 23.5h-1.5V20"></path>
          <path d="M11.5 17v-1.5H13"></path>
        </svg>
      </span>
      <span>Full page screenshot</span>
    </button>

    <div class="capture-shelf">
      <button class="shelf-action" data-mode="selection" title="Select a region to capture">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5V8"></path>
            <path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"></path>
            <path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"></path>
            <path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"></path>
          </svg>
        </span>
        <span>Select area</span>
      </button>
      <button class="shelf-action" data-mode="visible" title="Capture the visible viewport">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="6" width="17" height="13" rx="1.5"></rect>
            <path d="M3.5 10h17"></path>
            <path d="M7 8h.1"></path>
            <path d="M10 8h.1"></path>
            <path d="M13 8h.1"></path>
          </svg>
        </span>
        <span>Visible area</span>
      </button>
    </div>

    <div class="section-divider" aria-hidden="true"></div>

    <button class="history-row" id="history" type="button" title="Open saved screenshots">
      <span class="history-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10a7 7 0 1 0 2.1-5"></path>
          <path d="M3 4v5h5"></path>
          <path d="M10 6v4l2.5 1.5"></path>
        </svg>
      </span>
      <span>History</span>
      <span class="chevron" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m6 3.5 4.5 4.5L6 12.5"></path>
        </svg>
      </span>
    </button>
  </main>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
