<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Screenshot History</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #111318;
      --surface: #171a21;
      --panel: #1d222b;
      --panel-2: #252b36;
      --line: #343b49;
      --line-strong: #465064;
      --text: #f4f7fb;
      --muted: #9da8b8;
      --accent: #6c8cff;
      --danger: #ff5f68;
    }
    body {
      margin: 0;
      background:
        linear-gradient(180deg, #151820 0, var(--bg) 220px),
        var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 12px 18px;
      background: rgba(17, 19, 24, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    h1 {
      flex: 1;
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }
    .limit-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    input[type="number"] {
      width: 72px;
      min-height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 0 8px;
    }
    button,
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      padding: 0 12px;
      text-decoration: none;
    }
    button:hover,
    a:hover {
      border-color: var(--accent);
      background: #26304b;
    }
    main {
      padding: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.24);
    }
    .card:hover {
      border-color: var(--line-strong);
    }
    .thumb {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #090b0f;
      border-bottom: 1px solid var(--line);
    }
    .body {
      padding: 12px;
    }
    .title {
      overflow: hidden;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    #empty {
      color: var(--muted);
      padding: 48px 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Screenshot History</h1>
    <label class="limit-control" for="historyLimit">
      Keep
      <input id="historyLimit" type="number" min="1" max="50" value="20" />
    </label>
    <button id="clearAll" type="button">Clear all</button>
  </header>
  <main>
    <div id="empty" hidden>No saved screenshots yet.</div>
    <div class="grid" id="grid"></div>
  </main>
  <script src="history.js"></script>
</body>
</html>
