<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Full Page Screenshot</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #111318;
      --surface: #171a21;
      --panel: #1d222b;
      --panel-2: #252b36;
      --line: #343b49;
      --line-strong: #465064;
      --text: #f4f7fb;
      --muted: #9da8b8;
      --muted-2: #758195;
      --accent: #6c8cff;
      --accent-strong: #89a3ff;
      --green: #43d1a6;
      --danger: #ff5f68;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }
    body {
      margin: 0;
      min-width: 320px;
      background:
        linear-gradient(180deg, #151820 0, var(--bg) 220px),
        var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
      padding: 10px 18px;
      background: rgba(17, 19, 24, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    header h1 {
      flex: 1;
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #dimensions {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      line-height: 1;
      padding: 0 13px;
      text-decoration: none;
      white-space: nowrap;
    }
    .button.secondary {
      background: var(--panel-2);
      border-color: var(--line-strong);
      color: var(--text);
    }
    .button.success {
      background: #1f6b52;
      border-color: var(--green);
    }
    .button.danger {
      background: #6b2630;
      border-color: var(--danger);
    }
    .button:hover {
      filter: brightness(1.08);
    }
    .button:disabled {
      cursor: default;
      opacity: 0.6;
    }
    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: calc(100vh - 60px);
    }
    .panel {
      position: sticky;
      top: 60px;
      align-self: start;
      height: calc(100vh - 60px);
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 14px;
    }
    .panel h2 {
      margin: 0 0 14px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }
    .section {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }
    .label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }
    .tool {
      grid-column: span 3;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }
    .tool:hover,
    .tool.active {
      border-color: var(--accent-strong);
      background: #26304b;
      box-shadow: inset 0 0 0 1px rgba(137, 163, 255, 0.18);
    }
    .tool.compact { grid-column: span 2; }
    .control {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: #dce3ef;
      font-size: 13px;
    }
    input[type="color"] {
      width: 42px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 2px;
    }
    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--accent);
    }
    .color-swatches {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .swatch {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
    }
    .swatch.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--accent);
    }
    .swatch:hover {
      transform: translateY(-1px);
    }
    .value {
      min-width: 34px;
      color: var(--muted);
      text-align: right;
    }
    .panel-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(78px, 1fr));
      gap: 8px;
    }
    .preview-box {
      display: grid;
      place-items: center;
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(45deg, #252936 25%, transparent 25%),
        linear-gradient(-45deg, #252936 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #252936 75%),
        linear-gradient(-45deg, transparent 75%, #252936 75%);
      background-color: #171b23;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }
    #stylePreview {
      width: 230px;
      height: 92px;
    }
    .stage {
      min-width: 0;
      overflow: auto;
      padding: 28px;
    }
    .canvas-shell {
      display: inline-block;
      min-width: min(100%, 420px);
      position: relative;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #090b0f;
      box-shadow: var(--shadow);
    }
    #editorCanvas {
      display: block;
      max-width: min(100%, calc(100vw - 392px));
      height: auto;
      border-radius: 7px;
      cursor: crosshair;
      touch-action: none;
    }
    #editorCanvas:active {
      cursor: grabbing;
    }
    #status {
      padding: 44px;
      color: var(--muted);
      text-align: center;
    }
    .hint {
      margin: 10px 0 0;
      color: var(--muted-2);
      font-size: 12px;
      line-height: 1.35;
    }
    .text-editor-wrap {
      position: absolute;
      z-index: 2;
      min-width: 180px;
    }
    .text-editor {
      min-width: 180px;
      min-height: 42px;
      border: 2px solid var(--accent-strong);
      border-radius: 8px;
      background: rgba(12, 14, 19, 0.94);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-weight: 700;
      line-height: 1.2;
      outline: none;
      padding: 6px 8px;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-font-smoothing: antialiased;
    }
    .text-editor:empty::before {
      color: rgba(255, 255, 255, 0.55);
      content: attr(data-placeholder);
    }
    .text-editor-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .text-editor-actions button {
      min-height: 28px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 0 9px;
    }
    .text-editor-actions button.primary {
      background: var(--accent);
      border-color: var(--accent);
    }
    @media (max-width: 820px) {
      header {
        flex-wrap: wrap;
      }
      .workspace {
        display: block;
      }
      .panel {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #303540;
      }
      .stage {
        padding: 14px;
      }
      #editorCanvas {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Full Page Screenshot</h1>
    <span id="dimensions"></span>
    <div class="actions" id="actions" hidden>
      <button class="button secondary" id="copy" type="button">Copy</button>
      <button class="button success" id="upload" type="button">Upload & copy URL</button>
      <a class="button" id="downloadPng">PNG</a>
      <a class="button" id="downloadJpeg">JPEG</a>
      <a class="button" id="downloadPdf">PDF</a>
    </div>
  </header>
  <div class="workspace">
    <aside class="panel" id="annotationPanel" hidden>
      <h2>Annotate</h2>
      <div class="section">
        <span class="label">Tools</span>
        <div class="tool-grid" id="toolGrid">
          <button class="tool active" type="button" data-tool="arrow">Arrow</button>
          <button class="tool" type="button" data-tool="rect">Box</button>
          <button class="tool" type="button" data-tool="pen">Pen</button>
          <button class="tool" type="button" data-tool="text">Text</button>
          <button class="tool compact" type="button" data-tool="step">Step</button>
          <button class="tool compact" type="button" data-tool="pixelate">Pixelate</button>
          <button class="tool compact" type="button" data-tool="redact">Redact</button>
        </div>
        <p class="hint" id="toolHint">Drag to draw an arrow.</p>
      </div>
      <div class="section">
        <label class="label" for="color">Style</label>
        <div class="color-swatches" id="colorSwatches">
          <button class="swatch active" type="button" data-color="#ff3b30" style="background:#ff3b30" aria-label="Red"></button>
          <button class="swatch" type="button" data-color="#ff9500" style="background:#ff9500" aria-label="Orange"></button>
          <button class="swatch" type="button" data-color="#ffcc00" style="background:#ffcc00" aria-label="Yellow"></button>
          <button class="swatch" type="button" data-color="#34c759" style="background:#34c759" aria-label="Green"></button>
          <button class="swatch" type="button" data-color="#00c7be" style="background:#00c7be" aria-label="Teal"></button>
          <button class="swatch" type="button" data-color="#007aff" style="background:#007aff" aria-label="Blue"></button>
          <button class="swatch" type="button" data-color="#5856d6" style="background:#5856d6" aria-label="Indigo"></button>
          <button class="swatch" type="button" data-color="#af52de" style="background:#af52de" aria-label="Purple"></button>
          <button class="swatch" type="button" data-color="#ff2d55" style="background:#ff2d55" aria-label="Pink"></button>
          <button class="swatch" type="button" data-color="#ffffff" style="background:#ffffff" aria-label="White"></button>
          <button class="swatch" type="button" data-color="#8e8e93" style="background:#8e8e93" aria-label="Gray"></button>
          <button class="swatch" type="button" data-color="#111111" style="background:#111111" aria-label="Black"></button>
        </div>
        <div class="control">
          <span>Color</span>
          <input id="color" type="color" value="#ff3b30" />
        </div>
        <div class="control">
          <span>Stroke</span>
          <span class="value" id="strokeValue">5</span>
          <input id="stroke" type="range" min="2" max="18" value="5" />
        </div>
        <div class="control">
          <span>Text</span>
          <span class="value" id="textSizeValue">28</span>
          <input id="textSize" type="range" min="14" max="72" value="28" />
        </div>
      </div>
      <div class="section">
        <div class="panel-actions">
          <button class="button secondary" id="undo" type="button">Undo</button>
          <button class="button secondary" id="redo" type="button">Redo</button>
          <button class="button secondary" id="clear" type="button">Clear</button>
        </div>
      </div>
      <div class="section">
        <span class="label">Preview</span>
        <div class="preview-box">
          <canvas id="stylePreview" width="230" height="92"></canvas>
        </div>
      </div>
    </aside>
    <main class="stage">
      <div id="status">Stitching screenshot...</div>
      <div class="canvas-shell" id="canvasShell" hidden>
        <canvas id="editorCanvas"></canvas>
      </div>
    </main>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
